<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho de Extensão</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="SRC/cSS/stylesheet.css">




</head>

<body>



    <div class="app-shell">
        <aside class="sidebar p-3 ">
            <a class="brand d-flex align-center gap-2 mb-4" href="#">
                <span class="brand-mark">s2</span>
                <span>Maos que ajudam</span>
            </a>

            <p class="menu-label">Menu Principal</p>
            <nav class="nav flex-column gap-1" aria-label="Navegaçao principal">
                <a class="nav-link" href="index.html">HOME</a>
                <a class="nav-link" href="doacoes.html">DOAÇÕES</a>
            </nav>

        </aside>
        <main class="main-content" id="inicio">
            <header class="topbar d-flex justify-content-between align-items-center">
                <div>
                    <p class="eyebrow mb-1">Painel administrativo</p>
                    <h1 class="h4 mb-0">Doações necessárias</h1>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <button class="icon-button" type="button">*</button>
                    <div class="user-profile d-flex align-items-center gap-2">
                        <span class="avatar">WG</span>
                        <div class="d-nome d-sm-block">
                            <strong>Wellington Gomes</strong>
                            <small>Administrador</small>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content-area">
                <section class="panel h-100">
                    <div class="row g-3 mb-4">
                        <div class="col">
                            <label class="visually-hidden" for="search">Pesquisar</label>
                            <input class="form-control" type="search" placeholder="Pesquisar por item ou categoria"
                                id="search">
                        </div>
                        <div class="col-md-4">
                            <label class="visually-hidden" for="priority">Filtrar por prioridade</label>
                            <select class="form-select" id="priority">
                                <option value="todas">Todas</option>
                                <option value="urgente">Urgente</option>
                                <option value="atenção">Atenção</option>
                                <option value="normal">Normal</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-3" id="donations-content"></div>
                </section>
            </section>
        </main>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="SRC/app.js" type="module"></script>

</body>

</html>
